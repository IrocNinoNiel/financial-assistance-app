components:
  schemas:
    ColumnPayload:
      type: object
      properties:
        name: 
          type: string
          example: "gwa"
    DataSourcePayload:
      type: object
      properties:
        name:
          type: string
          example: "students"
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnPayload'
    GetDataSourceSuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: Resource Successfully Get!
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataSourcePayload'
        generatedAt:
          type: integer
          example: 1738335123028
    CriterionPayload:
      type: object
      properties:
        criterionCategoryId:
          type: string
          example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criteria'
        pairwise:
          type: array
          items:
            $ref: '#/components/schemas/Pairwise'
    Criteria:
      type: object
      properties:
        name:
          type: string
          example: "Monthly Income"
        label:
          type: string
          example: "Monthly Income of Applicant"
        dataSource:
          type: string
          example: "COLUMN"
        formulaType:
          type: string
          example: "SUM"
        preference:
          type: string
          example: "MIN"
        requiredColumns:
          type: array
          items:
            $ref: '#/components/schemas/RequiredColumns'
    RequiredColumns:
      type: object
      properties:
        table:
          type: string
          example: "students"
        column:
          type: string
          example: "gwa"
    Pairwise:
      type: object
      properties:
        criteriaNameA:
          type: string
          example: "GWA"
        criteriaNameB:
          type: string
          example: "Monthly Income"
        value:
          type: integer
          example: 1
    RegisterPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer2
        email:
          type: string
          example: qwer2@gmail.com
        password:
          type: string
          example: '123456'
        repassword:
          type: string
          example: '123456'
        roleId:
          type: string
          example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        mobileNumber:
          type: string
          example: '09837162132'
      required:
        - username
        - password
        - repassword
        - role
        - name
        - mobileNumber
    SchoolPayload:
      type: object
      properties:
        name:
          type: string
          example: "school 1"
        schoolType:
          type: string
          example: 'private'
        brgyId:
          type: integer
          example: 1
        provinceId:
          type: integer
          example: 2
        cityMunId:
          type: integer
          example: 3
      required:
        - username
        - password
        - repassword
        - role
        - name
        - mobileNumber
    SponsorshipPayload:
      type: object
      properties:
        name:
          type: string
          example: Sponsor number 1
        sponsorId:
          type: string
          example: a2815764-f067-11ef-ae8c-f4b520508eb0
        academicYearId:
          type: string
          example: a2815764-f067-11ef-ae8c-f4b520508eb0
        durationFrom:
          type: string
          example: "2023-08-02 00:00:00"
        durationTo:
          type: string
          example: "2023-09-02 00:00:00"
        batchNumber:
          type: integer
          example: 1
        limit:
          type: integer
          example: 1
        slot:
          type: integer
          example: 1
        fundAllocation:
          type: number
          example: 1000
        status:
          type: integer
          example: 1
        sponsorshipSchool:
          type: array
          items:
            type: string
            example: a2815764-f067-11ef-ae8c-f4b520508eb0
        sponsorshipRequirements:
          type: array
          items:
            type: string
            example: a2815764-f067-11ef-ae8c-f4b520508eb0
            
    ApplySponsorshipPayload:
      type: object
      properties:
        studentId:
          type: string
          example: a2815764-f067-11ef-ae8c-f4b520508eb0
        sponsorshipId:
          type: string
          example: a2815764-f067-11ef-ae8c-f4b520508eb0
    StudentRegisterPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer2
        email:
          type: string
          example: qwer2@gmail.com
        password:
          type: string
          example: '123456'
        repassword:
          type: string
          example: '123456'
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        mobileNumber:
          type: string
          example: '09837162132'
      required:
        - username
        - password
        - repassword
        - role
        - name
        - mobileNumber
    LoginPayload:
      type: object
      properties:
        username:
          type: string
