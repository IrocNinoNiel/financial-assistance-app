                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'


components:
  schemas:
    RegisterPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer2@gmail.com
        password:
          type: string
          example: '123456'
        repassword:
          type: string
          example: '123456'
        roleId:
          type: string
          example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        mobileNumber:
          type: string
          example: '09837162132'
      required:
        - username
        - password
        - repassword
        - role
        - name
        - mobileNumber
    LoginPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer9@gmail.com
        password:
          type: string
          example: '123456'
      required:
        - username
        - password
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INVALID-REQUEST
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: Request is not well-formed, syntactically incorrect, or violates schema.
        errorDetails:
          type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: field
                  value:
                    type: string
                    example: qwer2@gmail.com
                  msg:
                    type: string
                    example: E-mail already in use
                  path:
                    type: string
                    example: username
                  location:
                    type: string
                    example: body
    FileErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INVALID-REQUEST
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: Request is not well-formed, syntactically incorrect, or violates schema.
        errorDetails:
          type: object
          properties:
            message:
              type: string
              example: Application type must be pdf or docs
    InternalErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INTERNAL-SERVER-ERror
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: Server Errror Occured
        errorDetails:
          type: string
          example: Server Errror Occured
    ForbiddenErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: FORBIDDEN
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: The resource requested is forbidden for your API Key.
        errorDetails:
          type: string
          example: Invalid API Token
    NotFoundErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: NOT-FOUND
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: The resource requested is not found.
        errorDetails:
          type: string
          example: 404 not found
    FileSuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: Resource Successfully Created!
        data:
          type: string
          example: File successfully saved
        generatedAt:
          type: integer
          example: 1738335123028
    RegisterSuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: Resource Successfully Created!
        data:
          type: object
          properties:
            user:
              type: string
              example: qwer21@gmail.com
            userId:
              type: string
              example: 7ec6d79b-ad78-4d19-996b-9e24996e13f7
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjYsImVtYWlsIjoicXdlcjIxQGdtYWlsLmNvbSIsImlhdCI6MTczODMzNTEyMywiZXhwIjoxNzM4MzM4NzIzfQ.qkYL0BCp9-44xoCawM3jrh_AFpXTsdZjPAmBTjAgZzc
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/permission'
        generatedAt:
          type: integer
          example: 1738335123028
    LoginSuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Resource Successfully Created!
        data:
          type: object
          properties:
            user:
              type: string
              example: qwer21@gmail.com
            userId:
              type: string
              example: 7ec6d79b-ad78-4d19-996b-9e24996e13f7
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjYsImVtYWlsIjoicXdlcjIxQGdtYWlsLmNvbSIsImlhdCI6MTczODMzNTEyMywiZXhwIjoxNzM4MzM4NzIzfQ.qkYL0BCp9-44xoCawM3jrh_AFpXTsdZjPAmBTjAgZzc
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/permission'
        generatedAt:
          type: integer
          example: 1738335123028
    Student:
      type: object
      properties:
        studentId:
          type: string
          example: 7ec6d79b-ad78-4d19-996b-9e24996e13f7
        firstName:
          type: string
          example: John
        middleName:
          type: string
          example: Michael
        lastName:
          type: string
          example: Doe
        extension:
          type: string
          example: Jr
        sex:
          type: string
          example: Male
        placeOfBirth:
          type: string
          example: New York, USA
        birthdate:
          type: string
          format: date
          example: '2000-01-01'
        height:
          type: integer
          example: 170
        weight:
          type: integer
          example: 70
        permanentStreet: 
          type: string
          example: 123 Main Street
        permanentBarangayId: 
          type: integer
          example: 170
        permanentCityMunId: 
