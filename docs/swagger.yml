      responses:
        '201':
          description: Resource successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementSuccessUpdateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    get:
      tags:
        - Announcement
      summary: Get a announcement record
      description: Get the details of an existing announcement.
      parameters:
        - name: annId
          in: path
          required: true
          description: The ID of the announcement to be retreived
          schema:
            type: string
            example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementSuccessGetResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    delete:
      tags:
        - Announcement
      summary: Delete a announcement record
      description: Delete the details of an existing announcement.
      parameters:
        - name: annId
          in: path
          required: true
          description: The ID of the announcement to be deleted
          schema:
            type: string
            example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
      responses:
        '200':
          description: Succesful delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessDeleteResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /address/regions:
    get:
      tags:
        - Address
      summary: Get all region
      responses:
        '200':
          description: A list of region
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllRegionsSuccessResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
