openapi: 3.0.3
info:
  title: Financial Assistance Application API
  version: 1.0.0
  description: This API enables the management and processing of financial assistance applications.
    It allows students to apply for grants, and provides system admins and other roles access to manage and track the status of applications.
    The API supports roles such as students, financial assistance coordinators, and various offices responsible for managing the budget, processing payments, and approving grants.
    Key features include application submission, status updates, and administrative control over grant approvals and disbursements.
servers:
  - url: 'https://{environment}/api/v1'
    description: Server url
tags:
  - name: Authentication
    description: Endpoints for user authentication.
  - name: Student
    description: Endpoints for student information management
  - name: File Upload
    description: Endpoints for file upload
  - name: User
    description: Endpoints for User management
  - name: Announcement
    description: Endpoints for User announcement
paths:
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPayload'
      responses:
        '201':
          description: Resource successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /login:
    post:
      tags:
        - Authentication
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /students:
    post:
      tags:
        - Student
      summary: Add student information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPayload'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCreateSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    get:
      tags:
        - Student
      summary: Get all students
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term for filtering users
        - in: query
          name: sort
          schema:
            type: string
          description: Field to sort by
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
          description: Number of records to skip
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Maximum number of records to return
      responses:
        '200':
          description: A list of students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllStudentSuccessResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /students/{id}:
    get:
      tags:
        - Student
      summary: Get a student
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the student to be updated
          schema:
            type: integer
      responses:
        '200':
          description: A list of students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStudentSuccessResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    put:
      tags:
        - Student
      summary: Edit student information
      description: Updates the details of an existing student.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the student to be updated
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPayload'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentUpdateSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    delete:
      tags:
        - Student
      summary: Delete a student record
      description: Delete the details of an existing student.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the student to be deleted
          schema:
            type: integer
      responses:
        '200':
          description: delete details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessDeleteResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /file-upload:
    post:
      tags:
      - File Upload
      summary: Upload a file
      description: Endpoint to upload a file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
      responses:
        '201':
          description: File Succesfully saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileErrorResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
  /users:
    get:
      tags:
