          description: Search term for filtering users
        - in: query
          name: sort
          schema:
            type: string
          description: Field to sort by
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
          description: Number of records to skip
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Maximum number of records to return
      responses:
        '200':
          description: A list of users
          content:
