openapi: 3.0.3
info:
  title: Financial Assistance Application API
  version: 1.0.0
  description: This API enables the management and processing of financial assistance applications.
    It allows students to apply for grants, and provides system admins and other roles access to manage and track the status of applications.
    The API supports roles such as students, financial assistance coordinators, and various offices responsible for managing the budget, processing payments, and approving grants.
    Key features include application submission, status updates, and administrative control over grant approvals and disbursements.
servers:
  - url: 'https://{environment}/api/v1'
    description: Server url
tags:
  - name: Authentication
    description: Endpoints for user authentication.
  - name: Student
    description: Endpoints for student information management
paths:
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPayload'
      responses:
        '201':
          description: Resource successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login:
    post:
      tags:
        - Authentication
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /student:
    post:
      tags:
        - Student
      summary: Add student information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPayload'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
components:
  schemas:
    RegisterPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer2@gmail.com
        password:
          type: string
          example: '123456'
        repassword:
          type: string
          example: '123456'
        role:
          type: string
          example: Mayor’s Office
        name:
          type: object
          properties:
            firstName:
              type: string
              example: John
            lastName:
              type: string
              example: Doe
        mobileNumber:
          type: string
          example: '09837162132'
      required:
        - username
        - password
        - repassword
        - role
        - name
        - mobileNumber
    LoginPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer9@gmail.com
        password:
          type: string
          example: '123456'
      required:
        - username
        - password
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INVALID-REQUEST
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: Request is not well-formed, syntactically incorrect, or violates schema.
        errorDetails:
          type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: field
                  value:
                    type: string
                    example: qwer2@gmail.com
                  msg:
                    type: string
                    example: E-mail already in use
                  path:
                    type: string
                    example: username
                  location:
                    type: string
                    example: body
    ForbiddenErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INVALID-REQUEST
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: The resource requested is forbidden for your API Key.
        errorDetails:
          type: string
          example: Invalid API Token
