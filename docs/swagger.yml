  /users/{userId}:
    get:
      tags:
        - User
      summary: Get a user
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user to be retrieved
          schema:
            type: string
            example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
      responses:
        '200':
          description: A user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOneUserResponse'
        '403':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
    put:
      tags:
        - User
      summary: Edit user information
      description: Updates the details of an existing user.
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user to be updated
          schema:
            type: string
            example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPayload'
      responses:
        '200':
          description: Update successful
