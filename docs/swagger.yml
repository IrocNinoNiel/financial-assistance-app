      summary: Update a announcement record
      description: Updates the details of an existing announcement.
      parameters:
        - name: annId
          in: path
          required: true
          description: The ID of the announcement to be updated
          schema:
            type: string
            example: fa8d0ba7-3bd8-4a30-8127-82ca571d1bd0
      tags:
        - Announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
