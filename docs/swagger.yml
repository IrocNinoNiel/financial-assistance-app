components:
  schemas:
    RegisterPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer2@gmail.com
        password:
          type: string
          example: '123456'
        repassword:
          type: string
          example: '123456'
        role:
          type: string
          example: Mayor’s Office
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        mobileNumber:
          type: string
          example: '09837162132'
      required:
        - username
        - password
        - repassword
        - role
        - name
        - mobileNumber
    LoginPayload:
      type: object
      properties:
        username:
          type: string
          example: qwer9@gmail.com
        password:
          type: string
          example: '123456'
      required:
        - username
        - password
    ErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INVALID-REQUEST
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: Request is not well-formed, syntactically incorrect, or violates schema.
        errorDetails:
          type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: field
                  value:
                    type: string
                    example: qwer2@gmail.com
                  msg:
                    type: string
                    example: E-mail already in use
                  path:
                    type: string
                    example: username
                  location:
                    type: string
                    example: body
    FileErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INVALID-REQUEST
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: Request is not well-formed, syntactically incorrect, or violates schema.
        errorDetails:
          type: object
          properties:
            message:
              type: string
              example: Application type must be pdf or docs
    InternalErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: INTERNAL-SERVER-ERror
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: Server Errror Occured
        errorDetails:
          type: string
          example: Server Errror Occured
    ForbiddenErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: FORBIDDEN
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: The resource requested is forbidden for your API Key.
        errorDetails:
          type: string
          example: Invalid API Token
    NotFoundErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          example: NOT-FOUND
        generatedAt:
          type: integer
          example: 1738335047588
        description:
          type: string
          example: The resource requested is not found.
        errorDetails:
          type: string
          example: 404 not found
    FileSuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: Resource Successfully Created!
        data:
          type: string
          example: File successfully saved
        generatedAt:
          type: integer
          example: 1738335123028
    RegisterSuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 201
        message:
          type: string
          example: Resource Successfully Created!
        data:
          type: object
          properties:
            user:
              type: string
              example: qwer21@gmail.com
            token:
